<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayam Gepuk Artisan - Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@1.0.0"
        }
      }
    </script>
</head>
<body>
    <header>
        <img src="https://storage.googleapis.com/genai-web-assets/images/logo.png" alt="Ayam Gepuk Artisan Logo" class="logo">
        <h1>Ayam Gepuk Artisan</h1>
        <p>Rasa Ayam Gepuk Sebenar!</p>
    </header>
    <main>
        <div id="controls">
            <div class="form-group">
                <label for="prompt-template-select">Ayam Gepuk Artisan Prompt Templates</label>
                <select id="prompt-template-select" aria-label="Select a prompt template">
                    <option value="" disabled selected>Select a commercial template...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prompt-input">Prompt</label>
                <div class="prompt-controls">
                    <textarea id="prompt-input" rows="4" placeholder="Enter your image prompt or select a template..." aria-label="Image generation prompt"></textarea>
                    <button id="enhance-prompt-btn" type="button" class="enhance-btn" aria-label="Enhance prompt with AI">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        Enhance
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Prompt Idea Sparkers</label>
                <div id="prompt-sparkers-container">
                    <!-- Buttons will be generated by JS -->
                </div>
            </div>
            <div class="form-group">
                <label for="aspect-ratio-select">Aspect Ratio</label>
                <select id="aspect-ratio-select" aria-label="Image aspect ratio">
                    <option value="1:1" selected>1:1 (Square)</option>
                    <option value="3:4">3:4 (Portrait)</option>
                    <option value="4:3">4:3 (Landscape)</option>
                    <option value="16:9">16:9 (Widescreen)</option>
                    <option value="9:16">9:16 (Tall)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ai-provider-select">AI Provider</label>
                <select id="ai-provider-select" aria-label="Select AI image generation provider">
                    <option value="auto">🤖 Auto (Best Available)</option>
                    <option value="google">🔵 Google Imagen</option>
                    <option value="huggingface">🤗 Hugging Face SDXL</option>
                    <option value="together">⚡ Together AI</option>
                    <option value="stability">🎨 Stability AI</option>
                </select>
            </div>
            <div class="form-group">
                <label for="image-quality-select">Image Quality</label>
                <select id="image-quality-select" aria-label="Image quality setting">
                    <option value="high" selected>High Quality (Slower)</option>
                    <option value="medium">Medium Quality (Balanced)</option>
                    <option value="low">Low Quality (Faster)</option>
                </select>
            </div>
            <div class="form-group">
                <label>AI Provider Status</label>
                <div id="provider-status-container" class="provider-status">
                    <!-- Provider status will be populated by JS -->
                </div>
            </div>
             <div class="form-group">
                <label>Add-ons & Options</label>
                <div class="options-container">
                    <input type="checkbox" id="branded-paper-checkbox" class="option-checkbox" checked>
                    <label for="branded-paper-checkbox" class="option-button">Branded Paper</label>

                    <input type="checkbox" id="teh-o-ais-checkbox" class="option-checkbox" checked>
                    <label for="teh-o-ais-checkbox" class="option-button">Teh O Ais</label>
                    
                    <input type="checkbox" id="kicap-checkbox" class="option-checkbox">
                    <label for="kicap-checkbox" class="option-button">Kicap</label>
                    
                    <input type="checkbox" id="kubis-goreng-checkbox" class="option-checkbox">
                    <label for="kubis-goreng-checkbox" class="option-button">Kubis Goreng</label>
                    
                    <input type="checkbox" id="tahu-checkbox" class="option-checkbox">
                    <label for="tahu-checkbox" class="option-button">Tahu</label>
                    
                    <input type="checkbox" id="tempe-checkbox" class="option-checkbox">
                    <label for="tempe-checkbox" class="option-button">Tempe</label>
                    
                    <input type="checkbox" id="extra-sambal-checkbox" class="option-checkbox">
                    <label for="extra-sambal-checkbox" class="option-button">Extra Sambal</label>
                </div>
            </div>
            <button id="generate-btn">Generate Images</button>
        </div>
        <div id="image-gallery" role="status" aria-live="polite"></div>
    </main>

    <!-- AI Assistant -->
    <button id="ai-assistant-btn" aria-label="Open AI Assistant">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9a9 9 0 1 1-9-9Z"></path></svg>
    </button>

    <div id="ai-assistant-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ai-assistant-title">
        <div id="ai-assistant-overlay"></div>
        <div class="chat-container">
            <div class="chat-header">
                <h2 id="ai-assistant-title">AI Marketing Assistant</h2>
                <button id="ai-assistant-close-btn" aria-label="Close chat">&times;</button>
            </div>
            <div id="chat-messages">
                <!-- Messages will be appended here -->
            </div>
            <div id="typing-indicator" class="hidden">
                <span></span><span></span><span></span>
            </div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Ask for marketing ideas..." autocomplete="off">
                <button type="submit" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>
    
    <script type="module" src="index.tsx"></script>
</body>
</html>
